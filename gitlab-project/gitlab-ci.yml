stages:
  - test
  - build

test-job:
  stage: test
  script:
    - echo "Running tests for GitLab project..."
  rules:
    - changes:
        - "gitlab-project/**/*"

build-job:
  stage: build
  script:
    - echo "Building GitLab project..."
  rules:
    - changes:
        - "gitlab-project/**/*"
